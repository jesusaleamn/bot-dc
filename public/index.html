<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discord Guild Inventory Bot</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #111827;
        color: #e5e7eb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 680px;
        padding: 32px;
      }

      h1 {
        font-size: 32px;
        line-height: 1.1;
        margin: 0 0 16px;
      }

      p {
        color: #cbd5e1;
        line-height: 1.6;
      }

      code {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Discord Guild Inventory Bot</h1>
      <p>
        Sitio técnico del bot de inventarios. El endpoint de Discord está en
        <code>/discord-interactions</code> y la comprobación de salud en <code>/health</code>.
      </p>
    </main>
  </body>
</html>
